<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Local AI Studio</title>
  <style>
    body { font-family: system-ui; max-width: 680px; margin: 0 auto; padding: 24px; }
    #status { font-size: 14px; }
    textarea { width: 100%; box-sizing: border-box; }
    #hasil { white-space: pre-wrap; background: #f6f6f6; padding: 12px; min-height: 60px; }
  </style>
</head>
<body>
  <h1>Local AI Studio</h1>
  <p id="status">memeriksa mesin...</p>

  <div>
    <label>Model: </label>
    <select id="model" onchange="gantiModel()"></select>
  </div>

  <details>
    <summary>Unduh model</summary>
    <div id="katalog"></div>
    <p>
      <input id="urlModel" placeholder="atau tempel URL Hugging Face (.gguf)" style="width:70%">
      <button onclick="unduhURL()">Unduh</button>
    </p>
    <div id="progres"></div>
  </details>

  <p>
    <textarea id="input" rows="3" placeholder="Tulis pertanyaan..."></textarea>
    <button id="kirim" onclick="kirim()">Kirim</button>
  </p>

  <div id="hasil"></div>

  <script>
    function formatGB(b) {
      return (b / 1e9).toFixed(1) + " GB";
    }

    async function muatKatalog() {
      const res = await fetch("/api/catalog");
      const data = await res.json();
      document.getElementById("katalog").innerHTML = data.models.map(m => `
        <div style="margin:8px 0">
          <b>${m.name}</b> — ${formatGB(m.sizeBytes)}<br>
          <small>${m.note || ""}</small><br>
          ${m.installed
            ? "<span style='color:green'>✓ terpasang</span>"
            : `<button onclick="unduh('${m.url}')">Unduh</button>`}
        </div>
      `).join("");
    }

    async function unduh(url) {
      const res = await fetch("/api/models/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (data.error) alert(data.error);
      pantauProgres();
    }

    function unduhURL() {
      unduh(document.getElementById("urlModel").value.trim());
    }

    async function pantauProgres() {
      const el = document.getElementById("progres");
      const timer = setInterval(async () => {
        const p = await (await fetch("/api/progress")).json();

        if (p.error) {
          el.innerHTML = `<span style="color:crimson">⚠️ ${p.error}</span>`;
          clearInterval(timer);
          return;
        }
        if (p.done) {
          el.textContent = "✓ " + p.label;
          clearInterval(timer);
          muatKatalog();
          muatModel();
          return;
        }
        el.innerHTML = `
          ${p.label} — ${p.percent}% (${formatGB(p.downloaded)} / ${formatGB(p.total)})
          <button onclick="fetch('/api/models/cancel',{method:'POST'})">Batal</button>
        `;
      }, 500);
    }

    muatKatalog();
    
    async function cekStatus() {
      const el = document.getElementById("status");
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        if (data.mesinHidup) {
          el.textContent = "🟢 mesin siap — " + data.model;
          el.style.color = "green";
        } else {
          el.textContent = "🔴 mesin mati — cek terminal untuk pesan errornya";
          el.style.color = "crimson";
        }
      } catch {
        el.textContent = "⚪ aplikasi tidak terjangkau";
        el.style.color = "gray";
      }
    }

    async function muatModel() {
      const res = await fetch("/api/models");
      const data = await res.json();
      const sel = document.getElementById("model");

      if (data.models.length === 0) {
        sel.innerHTML = "<option>— taruh file .gguf di app/models/ —</option>";
        return;
      }

      sel.innerHTML = data.models
        .map(m => `<option ${m === data.active ? "selected" : ""}>${m}</option>`)
        .join("");
    }

    async function gantiModel() {
      const model = document.getElementById("model").value;
      const el = document.getElementById("status");
      el.textContent = "🟡 mengganti model...";
      el.style.color = "goldenrod";

      await fetch("/api/models/select", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model })
      });
      // status akan hijau sendiri lewat cekStatus tiap 3 detik
    }

    async function kirim() {
      const teks = document.getElementById("input").value;
      if (!teks.trim()) return;

      const hasil = document.getElementById("hasil");
      const tombol = document.getElementById("kirim");
      hasil.textContent = "";
      tombol.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: [{ role: "user", content: teks }],
            stream: true
          })
        });

        if (!res.ok) {
          const err = await res.json();
          hasil.textContent = "⚠️ " + err.error;
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let sisa = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          // Potongan dari jaringan bisa terpotong di tengah baris.
          // Sisanya disimpan untuk digabung dengan potongan berikutnya.
          sisa += decoder.decode(value, { stream: true });
          const baris = sisa.split("\n");
          sisa = baris.pop();

          for (const b of baris) {
            if (!b.startsWith("data: ")) continue;
            const isi = b.slice(6).trim();
            if (isi === "[DONE]") continue;

            try {
              const token = JSON.parse(isi).choices[0].delta.content;
              if (token) hasil.textContent += token;
            } catch {
              // potongan JSON belum utuh, abaikan
            }
          }
        }
      } finally {
        tombol.disabled = false;
      }
    }

    muatModel();
    cekStatus();
    setInterval(cekStatus, 3000);
  </script>
</body>
</html>
